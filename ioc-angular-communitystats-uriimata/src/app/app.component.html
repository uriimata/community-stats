<div style="padding: 20px; font-family: sans-serif;">
  <h1>{{ title }}</h1>

  <app-barra-cerca (textCercat)="elementService.cercar($event)"></app-barra-cerca>

  @if (elementService.carregant()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Carregant dades des de l'API...</p>
    </div>
  }

  @else if (elementService.error()) {
    <div class="error-state">
      <p>⚠️ {{ elementService.error() }}</p>
      <button (click)="elementService.obtenirPopulars()">Reintentar</button>
    </div>
  }

  @else {
    <app-llista-elements [elements]="elementService.elements()"></app-llista-elements>
    
    <table border="1" style="width:100%; margin-top: 20px;">
       ... (tu código de la tabla) ...
    </table>
  }
</div>
