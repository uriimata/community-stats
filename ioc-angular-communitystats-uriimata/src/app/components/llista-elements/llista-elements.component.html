<div class="grid-container" *ngIf="elements.length > 0; else buit">
  @for (el of elements; track el.id) {
    <app-targeta-element [element]="el"></app-targeta-element>
  }
</div>

<ng-template #buit>
  <div style="border: 2px dashed #ff0000; color: #ff0000; text-align: center; margin-top: 20px; padding: 20px;">
    <h3>⚠️ No s'han trobat coincidències</h3>
    <p>La cerca no ha retornat cap element del mock.</p>
  </div>
</ng-template>
