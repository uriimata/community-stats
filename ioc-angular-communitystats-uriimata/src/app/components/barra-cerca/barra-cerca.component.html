<form #meuForm="ngForm" (ngSubmit)="enviarCerca()" role="search">
  <div class="search-group">
    <label for="input-cerca" class="sr-only">Cercar per nom del joc</label>
    
    <input 
      id="input-cerca"
      type="text" 
      name="cerca"
      [(ngModel)]="terminiCerca"
      (ngModelChange)="onSearchChange($event)"
      #inputControl="ngModel" 
      required 
      minlength="3"
      placeholder="Ex: Zelda, Mario..."
    >

    <button type="submit" [disabled]="meuForm.invalid">Cercar</button>
  </div>

  @if (inputControl.invalid && inputControl.touched) {
    <div class="error-text">
      Escriu almenys 3 caràcters per cercar.
    </div>
  }
</form>
